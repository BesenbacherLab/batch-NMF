[coverage:paths]
source =
  src/batch_nmf
  */site-packages/batch_nmf

[coverage:run]
branch = true
source =
  src/batch_nmf
  tests
parallel = true

[coverage:report]
precision = 2
omit =
  src/batch_nmf/__init__.py
  src/batch_nmf/__main__.py
  tests/*

[coverage:html]
directory = build/coverage

[coverage:json]
output = build/coverage.json
