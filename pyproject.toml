[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "batch_nmf"
version = "0.1.0"
description = "pytorch implementation of NMF extentions that incorporate batch effects including Batch NMF(bNMF) and Sigmoid Filter NMF (sfNMF)."
authors = ["Søren Besenbacher <besenbacher@clin.au.dk>"]
license = "MIT License"
readme = "README.md"
repository = "https://github.com/besenbacherLab/batch_NMF"
homepage = "https://github.com/besenbacherLab/batch_NMF"
keywords = []
packages = [ { include = "batch_nmf", from = "src" } ]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
torch = ">=2.0.0, !=2.0.1, !=2.1.0"
#torch = "^2.0.1"
numpy = "^1.25.2"
matplotlib = "^3.7.2"
pandas = "^2.1.1"
scikit-learn = "^1.4.1.post1"

[tool.poetry.dev-dependencies]
# formatting, quality, tests
black = "^20.8b1"
pytest = "^6.2.2"
pytest-cov = "^2.11.1"
pytest-randomly = "^3.5.0"
pytest-sugar = "^0.9.4"
pytest-xdist = "^2.2.0"

# tasks
duty = "^0.6.0"
git-changelog = "^0.4.2"
httpx = "^0.16.1"
jinja2-cli = "^0.7.0"
toml = "^0.10.2"
MarkupSafe = "<2.1.0"

# docs
mkdocs = "^1.5.2"
mkdocs-coverage = "^0.2.1"
mkdocs-macros-plugin = "^0.5.0"
mkdocs-material = "^6.2.7"
mkdocstrings = "^0.22.0"

[tool.poetry.scripts]
batch_nmf = "batch_nmf.cli:main"

[tool.black]
line-length = 120
exclude = "tests/fixtures"

